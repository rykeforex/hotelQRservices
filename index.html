<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUORVA — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold-light: #E2C47A;
      --gold-pale: #F0DFA0;
      --gold-dim: rgba(201,168,76,0.18);
      --gold-glow: rgba(201,168,76,0.32);
      --cream: #FDFAF4;
      --ivory: #F7F2E8;
      --charcoal: #1C1A17;
      --charcoal-soft: #3A3630;
      --muted: #8A8070;
      --error: #B3492F;
    }

    body {
      min-height: 100vh;
      background-color: var(--cream);
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(201,168,76,0.13) 0%, transparent 70%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C9A84C' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      font-family: 'Montserrat', sans-serif;
      color: var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes lineExpand {
      from { width: 0; opacity: 0; }
      to   { width: 72px; opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .portal-wrapper {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 28px;
      border: 1px solid rgba(201,168,76,0.25);
      padding: 56px 48px 44px;
      box-shadow:
        0 4px 24px rgba(180,150,60,0.10),
        0 1px 3px rgba(180,150,60,0.08),
        0 32px 80px rgba(100,80,20,0.07);
      animation: fadeInUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeInUp 0.7s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }

    .system-eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    h1.brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(46px, 9vw, 58px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.04em;
      color: var(--charcoal);
    }
    h1.brand em {
      font-style: italic;
      color: var(--gold);
      font-weight: 600;
    }

    .powered-by {
      margin-top: 10px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .powered-by span {
      color: var(--gold);
      font-weight: 600;
    }

    .gold-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 24px auto 18px;
    }
    .gold-divider span {
      display: block;
      height: 1px;
      width: 56px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      animation: lineExpand 0.8s 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }
    .gold-divider .diamond {
      width: 6px;
      height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
      flex-shrink: 0;
      opacity: 0.85;
    }

    .hotel-name {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 16px;
      color: var(--charcoal-soft);
      letter-spacing: 0.02em;
    }

    /* ---------------- FORM ---------------- */

    form {
      animation: fadeInUp 0.7s 0.22s cubic-bezier(0.22,1,0.36,1) both;
    }

    .field-group {
      margin-bottom: 22px;
    }

    .field-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 9px;
    }

    .field-input-wrap {
      position: relative;
    }

    .field-input-wrap svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
      transition: stroke 0.25s ease;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 100%;
      padding: 14px 16px 14px 44px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--charcoal);
      background: var(--ivory);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }
    input[type="text"]::placeholder,
    input[type="password"]::placeholder,
    input[type="email"]::placeholder {
      color: rgba(138,128,112,0.6);
      font-weight: 300;
    }
    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="email"]:focus {
      border-color: var(--gold);
      background: #fff;
      box-shadow: 0 0 0 4px var(--gold-dim);
    }
    .field-input-wrap:has(input:focus) svg {
      stroke: var(--gold);
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .password-toggle svg {
      position: static;
      width: 16px;
      height: 16px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.6;
      transform: none;
    }
    .password-toggle:hover svg { stroke: var(--gold); }

    .form-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      font-size: 12px;
    }

    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .remember-wrap input[type="checkbox"] {
      appearance: none;
      width: 15px;
      height: 15px;
      border: 1px solid rgba(201,168,76,0.5);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: background 0.25s ease, border-color 0.25s ease;
      flex-shrink: 0;
    }
    .remember-wrap input[type="checkbox"]:checked {
      background: var(--gold);
      border-color: var(--gold);
    }
    .remember-wrap input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .forgot-link {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: color 0.2s ease;
    }
    .forgot-link:hover { color: var(--charcoal); }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s ease;
      box-shadow: 0 8px 24px rgba(201,168,76,0.28);
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(201,168,76,0.38);
    }
    .submit-btn:active {
      transform: translateY(0);
    }
    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
      transition: left 0.6s ease;
    }
    .submit-btn:hover::before { left: 100%; }

    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(179,73,47,0.07);
      border: 1px solid rgba(179,73,47,0.25);
      color: var(--error);
      font-size: 12px;
      font-weight: 400;
      padding: 11px 14px;
      border-radius: 10px;
      margin-bottom: 22px;
    }
    .error-msg.show {
      display: flex;
      animation: shake 0.4s ease;
    }
    .error-msg svg {
      width: 15px; height: 15px;
      stroke: var(--error);
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .footer-note {
      text-align: center;
      margin-top: 34px;
      font-size: 10.5px;
      letter-spacing: 0.16em;
      color: rgba(138,128,112,0.55);
      text-transform: uppercase;
      animation: fadeInUp 0.7s 0.38s cubic-bezier(0.22,1,0.36,1) both;
    }
    .footer-note p + p { margin-top: 8px; }
  </style>
  <script>
/**
 * ui-kit.js
 *
 * Shared, dependency-free luxury UI feedback kit: toast notifications and
 * button loading states. Include it once per page (inline or external).
 *
 * Usage:
 *   LuxeUI.toast('success', 'Welcome back', 'Redirecting to your dashboard…');
 *   LuxeUI.toast('error', 'Sign in failed', 'Check your email and password.');
 *
 *   LuxeUI.loading(myButton, true, 'Signing in…');   // start
 *   LuxeUI.loading(myButton, false);                  // stop, restores original content
 *
 * Self-contained: injects its own <style> once, doesn't require any other
 * file, and never throws if called before the DOM is fully ready.
 */
(function (global) {
  var STYLE_ID = 'luxe-ui-styles';
  var CONTAINER_ID = 'luxe-toast-container';
  var originalContent = new WeakMap();

  function ensureStyles() {
    if (document.getElementById(STYLE_ID)) return;
    var style = document.createElement('style');
    style.id = STYLE_ID;
    style.textContent = `
      #${CONTAINER_ID} {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: min(380px, calc(100vw - 32px));
        pointer-events: none;
      }
      .luxe-toast {
        pointer-events: auto;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 16px 18px;
        border-radius: 16px;
        background: linear-gradient(150deg, rgba(24,22,18,0.96), rgba(15,14,12,0.98));
        border: 1px solid rgba(201,168,76,0.35);
        box-shadow: 0 18px 40px -12px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.02) inset;
        color: #f4efe3;
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        cursor: pointer;
        animation: luxeToastIn 0.45s cubic-bezier(.16,1,.3,1);
        backdrop-filter: blur(14px);
      }
      .luxe-toast.leaving { animation: luxeToastOut 0.35s ease forwards; }
      .luxe-toast::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
      }
      .luxe-toast.success::before { background: linear-gradient(180deg, #c9a84c, #e2c47a); }
      .luxe-toast.error::before { background: linear-gradient(180deg, #b3492f, #d97256); }
      .luxe-toast.info::before { background: linear-gradient(180deg, #8a8070, #b7ac95); }
      .luxe-toast-icon {
        flex-shrink: 0;
        width: 26px; height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        margin-top: 1px;
      }
      .luxe-toast.success .luxe-toast-icon { background: rgba(201,168,76,0.16); color: #e2c47a; }
      .luxe-toast.error .luxe-toast-icon { background: rgba(179,73,47,0.18); color: #e79176; }
      .luxe-toast.info .luxe-toast-icon { background: rgba(138,128,112,0.18); color: #cfc6b4; }
      .luxe-toast-icon svg { width: 15px; height: 15px; }
      .luxe-toast-body { flex: 1; min-width: 0; }
      .luxe-toast-title { font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.35; }
      .luxe-toast-message { font-size: 12.5px; color: #b9b0a0; margin-top: 3px; line-height: 1.45; }
      .luxe-toast-progress {
        position: absolute; left: 0; bottom: 0; height: 2px;
        background: linear-gradient(90deg, #c9a84c, #e2c47a);
        animation-name: luxeToastProgress;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }
      @keyframes luxeToastIn {
        from { opacity: 0; transform: translateX(24px) scale(0.97); }
        to { opacity: 1; transform: translateX(0) scale(1); }
      }
      @keyframes luxeToastOut {
        to { opacity: 0; transform: translateX(24px) scale(0.97); }
      }
      @keyframes luxeToastProgress {
        from { width: 100%; } to { width: 0%; }
      }
      .luxe-btn-spinner {
        display: inline-block;
        width: 15px; height: 15px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.35);
        border-top-color: #fff;
        animation: luxeSpin 0.7s linear infinite;
        vertical-align: -3px;
        margin-right: 8px;
      }
      @keyframes luxeSpin { to { transform: rotate(360deg); } }
      .luxe-loading { opacity: 0.85; cursor: progress !important; pointer-events: none; }
      @media (max-width: 480px) {
        #${CONTAINER_ID} { left: 16px; right: 16px; top: 16px; max-width: none; }
      }
    `;
    document.head.appendChild(style);
  }

  function ensureContainer() {
    var el = document.getElementById(CONTAINER_ID);
    if (!el) {
      el = document.createElement('div');
      el.id = CONTAINER_ID;
      document.body.appendChild(el);
    }
    return el;
  }

  var ICONS = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
  };

  function toast(type, title, message, duration) {
    try {
      ensureStyles();
      var container = ensureContainer();
      type = ICONS[type] ? type : 'info';
      duration = duration || (type === 'error' ? 6000 : 4200);

      var el = document.createElement('div');
      el.className = 'luxe-toast ' + type;
      el.innerHTML =
        '<span class="luxe-toast-icon">' + ICONS[type] + '</span>' +
        '<span class="luxe-toast-body">' +
          '<span class="luxe-toast-title"></span>' +
          (message ? '<span class="luxe-toast-message"></span>' : '') +
        '</span>' +
        '<span class="luxe-toast-progress" style="animation-duration:' + duration + 'ms;"></span>';
      el.querySelector('.luxe-toast-title').textContent = title || '';
      if (message) el.querySelector('.luxe-toast-message').textContent = message;

      function dismiss() {
        if (el.classList.contains('leaving')) return;
        el.classList.add('leaving');
        setTimeout(function () { el.remove(); }, 350);
      }
      el.addEventListener('click', dismiss);
      var timer = setTimeout(dismiss, duration);
      el.addEventListener('mouseenter', function () { clearTimeout(timer); });
      el.addEventListener('mouseleave', function () { timer = setTimeout(dismiss, 1200); });

      container.appendChild(el);
      return el;
    } catch (err) {
      // Never let a UI-polish failure break the actual auth flow.
      console.warn('LuxeUI.toast failed:', err.message);
    }
  }

  function loading(button, isLoading, label) {
    if (!button) return;
    try {
      ensureStyles();
      if (isLoading) {
        if (!originalContent.has(button)) originalContent.set(button, button.innerHTML);
        button.innerHTML = '<span class="luxe-btn-spinner"></span>' + (label || 'Please wait…');
        button.classList.add('luxe-loading');
        button.disabled = true;
      } else {
        if (originalContent.has(button)) {
          button.innerHTML = originalContent.get(button);
          originalContent.delete(button);
        }
        button.classList.remove('luxe-loading');
        button.disabled = false;
      }
    } catch (err) {
      console.warn('LuxeUI.loading failed:', err.message);
    }
  }

  global.LuxeUI = { toast: toast, loading: loading };
})(window);

</script>
</head>
<body>

  <div class="portal-wrapper">

    <div class="header">
      <div class="system-eyebrow">Hospitality Management System</div>
      <h1 class="brand">QUOR<em>VA</em></h1>
      <div class="powered-by">Powered by <span>Peerloom Technologies</span></div>

      <div class="gold-divider">
        <span></span>
        <div class="diamond"></div>
        <span></span>
      </div>

      <!-- Dynamic: replace with actual property/hotel name at render time -->
      <div class="hotel-name" id="hotelName">LUXE Hotel</div>
    </div>

    <!-- ============================================================
         LOGIN FORM
         Front-end only for now. On submit:
           1. Send credentials to auth endpoint (to be built)
           2. Receive user role + assigned department/location
           3. Redirect:
              - role === 'staff'    -> department-specific dashboard
                                       (e.g. /departments/{departmentSlug}/dashboard.html)
              - role === 'director' -> director_dashboard.html
              - role === 'hotel_admin' -> hotel_admin.html
           4. Only 'admin' role can access user-creation tools,
              enforced server-side, not just hidden in UI.
         ============================================================ -->
    <form id="loginForm" novalidate>

      <div class="error-msg" id="errorMsg">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorText">Invalid email or password.</span>
      </div>

      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <div class="field-input-wrap">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <div class="field-input-wrap">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
            <svg viewBox="0 0 24 24" id="eyeIcon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-meta">
        <label class="remember-wrap">
          <input type="checkbox" id="remember" name="remember">
          Remember me
        </label>
        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
          <a href="#" class="forgot-link">Forgot password?</a>
          <a href="/signup.html" class="forgot-link">Create hotel account</a>
        </div>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>

    </form>

    <div class="footer-note">
      <p>Private &nbsp;&bull;&nbsp; Authorised Access Only</p>
      <p>&copy; 2025 Peerloom Technologies. All rights reserved.</p>
    </div>

  </div>

  <script>
    // Password show/hide toggle
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.innerHTML = isPassword
        ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    // ============================================================
    // LOGIN SUBMIT HANDLER
    // Authenticate users through the backend at /api/auth/login.
    // Expected response:
    //   { role: 'hotel_admin' | 'director' | 'staff', token, user, redirectUrl, dept }
    // The backend must provide secure hashed password validation.
    // ============================================================

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const URL_HOTEL_ID = parseInt(new URLSearchParams(window.location.search).get('hotelId') || '', 10) || null;
    const API_BASE_URL =
      window.location.protocol === 'file:' || !window.location.hostname ||
      window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:3000'
        : 'https://hotelqrservices.onrender.com';

    function appendHotelId(url) {
      if (!URL_HOTEL_ID) return url;
      const separator = url.includes('?') ? '&' : '?';
      return `${url}${separator}hotelId=${URL_HOTEL_ID}`;
    }

    function showError(message) {
      errorText.textContent = message;
      errorMsg.classList.remove('show');
      void errorMsg.offsetWidth; // restart animation
      errorMsg.classList.add('show');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const email = document.getElementById('email').value.trim();
      const submitBtn = form.querySelector('.submit-btn');

      if (!email || !password) {
        showError('Please enter both email and password.');
        window.LuxeUI?.toast('error', 'Missing details', 'Please enter both email and password.');
        return;
      }

      window.LuxeUI?.loading(submitBtn, true, 'Signing in…');

      try {
        const res = await fetch(API_BASE_URL + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok && data.role === 'hotel_admin') {
          window.LuxeUI?.toast('success', 'Welcome back', 'Taking you to your admin suite…');
          localStorage.setItem('hotelAdminToken', data.token);
          localStorage.setItem('hotelAdminUser', JSON.stringify(data.user || {}));
          setTimeout(() => { window.location.href = data.redirectUrl || 'hotel_admin.html'; }, 450);
          return;
        }

        if (res.ok && data.role === 'director') {
          window.LuxeUI?.toast('success', 'Welcome back', 'Taking you to the director suite…');
          const name = data.user?.fullName || data.user?.username || email;
          const initials = name.split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]).join('').toUpperCase();
          const params = new URLSearchParams({ name, initials });
          const targetUrl = appendHotelId((data.redirectUrl || 'director_dashboard.html') + '?' + params.toString());
          setTimeout(() => { window.location.href = targetUrl; }, 450);
          return;
        }

        window.LuxeUI?.loading(submitBtn, false);

        // Backend was reached but responded with something other than a plain
        // "wrong credentials" (401) — surface the real error instead of silently
        // falling through to the demo-account check below, which just shows a
        // generic "invalid username or password" and hides the actual problem
        // (e.g. a 500 from a missing database table, a locked account, etc).
        if (res.status !== 401) {
          const msg = data.error || `Server error (${res.status}). Please try again or contact your administrator.`;
          showError(msg);
          window.LuxeUI?.toast('error', 'Sign in failed', msg);
          return;
        }
        showError('Invalid email or password.');
        window.LuxeUI?.toast('error', 'Sign in failed', 'Invalid email or password.');
        return;
      } catch (err) {
        window.LuxeUI?.loading(submitBtn, false);
        showError('Unable to reach authentication server. Please try again later.');
        window.LuxeUI?.toast('error', 'Connection problem', 'Unable to reach the authentication server. Please try again later.');
        return;
      }
    });
  </script>

<script>
/**
 * branding-loader.js
 *
 * Drop-in script for guest/staff-facing pages (index.html, request.html,
 * director_dashboard.html, department_dashboard.html). Reads `hotelId` from
 * the URL, fetches public branding from the backend, and applies it:
 *   - favicon
 *   - CSS custom-property color theming (only on pages that define --gold)
 *   - Tailwind arbitrary-value color overrides (department_dashboard.html)
 *   - hotel name into the guest logo text (request.html)
 *
 * Fails silently on any error so a missing/misconfigured hotel never breaks
 * the page. Include it once per page (inline or external), near the end
 * of the body.
 */
(function () {
  function getHotelId() {
    try {
      var params = new URLSearchParams(window.location.search);
      var id = parseInt(params.get('hotelId') || '', 10);
      return id || null;
    } catch (e) {
      return null;
    }
  }

  function resolveApiBase() {
    var host = window.location.hostname;
    return (host === 'localhost' || host === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://hotelqrservices-production.up.railway.app';
  }

  function setFavicon(url) {
    if (!url) return;
    var link = document.querySelector('link[rel="icon"]');
    if (!link) {
      link = document.createElement('link');
      link.rel = 'icon';
      document.head.appendChild(link);
    }
    link.href = url;
  }

  function hexToRgba(hex, alpha) {
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
    if (!m) return null;
    var r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  // Only applies to pages that already theme themselves via a --gold custom
  // property (index.html, director_dashboard.html). Pages without it are
  // left untouched.
  function applyCssVarTheme(colors) {
    if (!colors || !colors.primary) return;
    var root = document.documentElement;
    var existing = getComputedStyle(root).getPropertyValue('--gold').trim();
    if (!existing) return;
    root.style.setProperty('--gold', colors.primary);
    if (colors.accent) root.style.setProperty('--gold-light', colors.accent);
    var dim = hexToRgba(colors.primary, 0.18);
    var glow = hexToRgba(colors.primary, 0.32);
    if (dim) root.style.setProperty('--gold-dim', dim);
    if (glow) root.style.setProperty('--gold-glow', glow);
  }

  // department_dashboard.html uses hardcoded Tailwind arbitrary-value
  // classes (text-[#b49450], bg-[#b49450], hover:bg-[#a08040], etc.)
  // instead of a CSS variable. Only inject the override if those exact
  // classes are present, so this is a no-op on every other page.
  function applyDeptDashboardOverrides(colors) {
    if (!colors || !colors.primary) return;
    if (!document.querySelector('[class*="b49450"]')) return;
    var primary = colors.primary;
    var hover = colors.secondary || colors.accent || primary;
    var style = document.createElement('style');
    style.id = 'brandingOverride';
    style.textContent =
      '.text-\\[\\#b49450\\]{color:' + primary + ' !important;}' +
      '.bg-\\[\\#b49450\\]{background-color:' + primary + ' !important;}' +
      '.border-\\[\\#b49450\\]{border-color:' + primary + ' !important;}' +
      '.hover\\:bg-\\[\\#a08040\\]:hover{background-color:' + hover + ' !important;}' +
      '.hover\\:text-\\[\\#b49450\\]:hover{color:' + primary + ' !important;}' +
      '.focus\\:ring-\\[\\#b49450\\]:focus{--tw-ring-color:' + primary + ' !important;}' +
      '.focus\\:border-\\[\\#b49450\\]:focus{border-color:' + primary + ' !important;}';
    document.head.appendChild(style);
  }

  // request.html has a dedicated .logo-text element for the hotel name —
  // safe, single-node swap. Everything else on that page stays as-is.
  function applyLogoText(hotelName) {
    if (!hotelName) return;
    var logoText = document.querySelector('.logo-text');
    if (logoText) logoText.textContent = hotelName.toUpperCase();
  }

  async function init() {
    var hotelId = getHotelId();
    if (!hotelId) return;
    try {
      var res = await fetch(resolveApiBase() + '/api/branding/public?hotelId=' + hotelId);
      if (!res.ok) return;
      var data = await res.json();

      setFavicon(data.faviconUrl);
      applyCssVarTheme(data.brandColors);
      applyDeptDashboardOverrides(data.brandColors);
      applyLogoText(data.hotelName);

      // Expose the full payload for pages that want to use more of it
      // (e.g. a future welcome-message banner) without re-fetching.
      window.hotelBranding = data;
      document.dispatchEvent(new CustomEvent('hotelBrandingLoaded', { detail: data }));
    } catch (err) {
      console.warn('Branding load skipped:', err.message);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
