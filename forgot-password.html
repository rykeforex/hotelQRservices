<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUORVA — Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C9A84C;
      --gold-light: #E2C47A;
      --gold-dim: rgba(201,168,76,0.18);
      --cream: #FDFAF4;
      --ivory: #F7F2E8;
      --charcoal: #1C1A17;
      --muted: #8A8070;
      --error: #B3492F;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(201,168,76,0.13), transparent 70%),
        var(--cream);
      color: var(--charcoal);
      font-family: 'Montserrat', sans-serif;
    }
    .card {
      width: 100%;
      max-width: 460px;
      padding: 48px 40px 36px;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 4px 24px rgba(180,150,60,0.10), 0 32px 80px rgba(100,80,20,0.07);
    }
    .header { margin-bottom: 32px; text-align: center; }
    .eyebrow {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 46px;
      font-weight: 300;
      line-height: 1;
    }
    h1 em { color: var(--gold); font-weight: 600; }
    h2 { margin-top: 24px; font-size: 15px; font-weight: 600; }
    .intro {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    .field-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 9px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 12px;
      outline: none;
      background: var(--ivory);
      color: var(--charcoal);
      font: 14px 'Montserrat', sans-serif;
    }
    input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-dim); }
    .message {
      display: none;
      margin-bottom: 18px;
      padding: 13px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .message.show { display: block; }
    .message.error { background: rgba(179,73,47,0.1); color: var(--error); }
    .message.success { background: rgba(47,125,50,0.12); color: #2f7d32; }
    .submit-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      box-shadow: 0 8px 24px rgba(201,168,76,0.28);
      color: #fff;
      cursor: pointer;
      font: 600 11.5px 'Montserrat', sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .submit-btn:hover { transform: translateY(-1px); }
    .submit-btn:disabled { cursor: wait; opacity: 0.7; transform: none; }
    .footer-link { margin-top: 24px; color: var(--muted); font-size: 13px; text-align: center; }
    .footer-link a { color: var(--gold); font-weight: 600; text-decoration: none; }
    @media (max-width: 480px) { .card { padding: 40px 24px 30px; } }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="eyebrow">Hospitality Management System</div>
      <h1>QUOR<em>VA</em></h1>
      <h2>Forgot your password?</h2>
      <p class="intro">Enter your hotel admin email address to request a password reset. A hotel administrator will review your request.</p>
    </header>

    <div class="message error" id="errorMessage" role="alert"></div>
    <div class="message success" id="successMessage" role="status" aria-live="polite"></div>

    <form id="resetRequestForm">
      <div class="field-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="admin@yourhotel.com" required>
      </div>
      <button class="submit-btn" type="submit">Request password reset</button>
    </form>

    <div class="footer-link"><a href="index.html">Back to sign in</a></div>
  </main>

  <script>
    const API_BASE_URL = window.location.protocol === 'file:' || !window.location.hostname ||
      window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:3000'
        : 'https://hotelqrservices.onrender.com';
    const form = document.getElementById('resetRequestForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const submitButton = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');
      submitButton.disabled = true;
      submitButton.textContent = 'Submitting…';

      try {
        const response = await fetch(API_BASE_URL + '/api/auth/hotel-admin/password-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || 'Unable to submit your request. Please try again.');
        }

        successMessage.textContent = 'If an account exists for that email, your reset request has been submitted for administrator review.';
        successMessage.classList.add('show');
        form.reset();
      } catch (error) {
        errorMessage.textContent = error.message || 'Unable to reach the server. Please try again.';
        errorMessage.classList.add('show');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Request password reset';
      }
    });
  </script>
</body>
</html>
