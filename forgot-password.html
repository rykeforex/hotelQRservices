<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUORVA — Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C9A84C;
      --gold-light: #E2C47A;
      --gold-pale: #F0DFA0;
      --gold-dim: rgba(201,168,76,0.18);
      --cream: #FDFAF4;
      --ivory: #F7F2E8;
      --charcoal: #1C1A17;
      --charcoal-soft: #3A3630;
      --muted: #8A8070;
      --error: #B3492F;
    }
    body {
      min-height: 100vh;
      background-color: var(--cream);
      font-family: 'Montserrat', sans-serif;
      color: var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 28px;
      border: 1px solid rgba(201,168,76,0.25);
      padding: 44px 40px;
      box-shadow: 0 10px 40px rgba(100,80,20,0.08);
    }
    .header { text-align: center; margin-bottom: 28px; }
    .eyebrow { font-size: 10px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 300; }
    h1 em { color: var(--gold); font-style: italic; font-weight: 600; }
    .subtext { margin-top: 10px; color: var(--muted); font-size: 14px; }
    .field-group { margin-bottom: 16px; }
    label { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
    input { width: 100%; padding: 14px 16px; font-size: 14px; border: 1px solid rgba(201,168,76,0.25); border-radius: 12px; background: var(--ivory); outline: none; }
    input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-dim); }
    .alert { display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 12px; background: rgba(179,73,47,0.1); color: var(--error); font-size: 14px; }
    .alert.show { display: block; }
    .success { background: rgba(47,125,50,0.12); color: #2f7d32; }
    .verification-box { display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 12px; background: rgba(201,168,76,0.12); color: var(--charcoal); font-size: 13px; }
    button { width: 100%; padding: 14px 16px; border: none; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--gold-light)); color: #fff; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: progress; opacity: 0.85; transform: none; }
    .button-spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      margin-right: 9px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: buttonSpin 0.7s linear infinite;
      vertical-align: -3px;
    }
    @keyframes buttonSpin { to { transform: rotate(360deg); } }
    .footer-link { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
    .footer-link a { color: var(--gold); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="eyebrow">Hospitality Management System</div>
      <h1>QUOR<em>VA</em></h1>
      <p class="subtext">Enter your account email and we will send you a link to choose a new password.</p>
    </div>
    <div class="alert" id="errorMsg"></div>
    <div class="alert success" id="successMsg"></div>
    <form id="forgotForm">
      <div class="field-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="admin@yourhotel.com" required />
      </div>
      <button type="submit" id="submitBtn">Send Reset Link</button>
    </form>
    <div class="footer-link">
      <a href="/">Back to sign in</a>
    </div>
  </div>
  <script>
    const API_BASE_URL = window.location.protocol === 'file:' || !window.location.hostname || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:3000'
      : 'https://hotelqrservices.onrender.com';
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    function show(el, other, msg) { el.textContent = msg; el.classList.add('show'); other.classList.remove('show'); }
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      btn.innerHTML = '<span class="button-spinner" aria-hidden="true"></span><span>Sending…</span>';
      try {
        const res = await fetch(API_BASE_URL + '/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) show(successMsg, errorMsg, data.message || 'If an account exists for that email, a reset link has been sent.');
        else show(errorMsg, successMsg, data.error || 'Could not send the reset email.');
      } catch (err) {
        show(errorMsg, successMsg, 'Unable to reach the server. Please try again.');
      } finally {
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
