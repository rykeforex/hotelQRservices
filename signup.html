<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUORVA — Create Your Hotel Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C9A84C;
      --gold-light: #E2C47A;
      --gold-pale: #F0DFA0;
      --gold-dim: rgba(201,168,76,0.18);
      --cream: #FDFAF4;
      --ivory: #F7F2E8;
      --charcoal: #1C1A17;
      --charcoal-soft: #3A3630;
      --muted: #8A8070;
      --error: #B3492F;
    }
    body {
      min-height: 100vh;
      background-color: var(--cream);
      font-family: 'Montserrat', sans-serif;
      color: var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 28px;
      border: 1px solid rgba(201,168,76,0.25);
      padding: 44px 40px;
      box-shadow: 0 10px 40px rgba(100,80,20,0.08);
    }
    .header { text-align: center; margin-bottom: 28px; }
    .eyebrow { font-size: 10px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 300; }
    h1 em { color: var(--gold); font-style: italic; font-weight: 600; }
    .subtext { margin-top: 10px; color: var(--muted); font-size: 14px; }
    .field-group { margin-bottom: 16px; }
    label { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
    input { width: 100%; padding: 14px 16px; font-size: 14px; border: 1px solid rgba(201,168,76,0.25); border-radius: 12px; background: var(--ivory); outline: none; }
    input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-dim); }
    .alert { display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 12px; background: rgba(179,73,47,0.1); color: var(--error); font-size: 14px; }
    .alert.show { display: block; }
    .success { background: rgba(47,125,50,0.12); color: #2f7d32; }
    .verification-box { display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 12px; background: rgba(201,168,76,0.12); color: var(--charcoal); font-size: 13px; }
    button { width: 100%; padding: 14px 16px; border: none; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--gold-light)); color: #fff; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button:hover { transform: translateY(-1px); }
    .footer-link { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
    .footer-link a { color: var(--gold); text-decoration: none; font-weight: 600; }
  </style>
  <script>
/**
 * ui-kit.js
 *
 * Shared, dependency-free luxury UI feedback kit: toast notifications and
 * button loading states. Include it once per page (inline or external).
 *
 * Usage:
 *   LuxeUI.toast('success', 'Welcome back', 'Redirecting to your dashboard…');
 *   LuxeUI.toast('error', 'Sign in failed', 'Check your email and password.');
 *
 *   LuxeUI.loading(myButton, true, 'Signing in…');   // start
 *   LuxeUI.loading(myButton, false);                  // stop, restores original content
 *
 * Self-contained: injects its own <style> once, doesn't require any other
 * file, and never throws if called before the DOM is fully ready.
 */
(function (global) {
  var STYLE_ID = 'luxe-ui-styles';
  var CONTAINER_ID = 'luxe-toast-container';
  var originalContent = new WeakMap();

  function ensureStyles() {
    if (document.getElementById(STYLE_ID)) return;
    var style = document.createElement('style');
    style.id = STYLE_ID;
    style.textContent = `
      #${CONTAINER_ID} {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: min(380px, calc(100vw - 32px));
        pointer-events: none;
      }
      .luxe-toast {
        pointer-events: auto;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 16px 18px;
        border-radius: 16px;
        background: linear-gradient(150deg, rgba(24,22,18,0.96), rgba(15,14,12,0.98));
        border: 1px solid rgba(201,168,76,0.35);
        box-shadow: 0 18px 40px -12px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.02) inset;
        color: #f4efe3;
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        cursor: pointer;
        animation: luxeToastIn 0.45s cubic-bezier(.16,1,.3,1);
        backdrop-filter: blur(14px);
      }
      .luxe-toast.leaving { animation: luxeToastOut 0.35s ease forwards; }
      .luxe-toast::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
      }
      .luxe-toast.success::before { background: linear-gradient(180deg, #c9a84c, #e2c47a); }
      .luxe-toast.error::before { background: linear-gradient(180deg, #b3492f, #d97256); }
      .luxe-toast.info::before { background: linear-gradient(180deg, #8a8070, #b7ac95); }
      .luxe-toast-icon {
        flex-shrink: 0;
        width: 26px; height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        margin-top: 1px;
      }
      .luxe-toast.success .luxe-toast-icon { background: rgba(201,168,76,0.16); color: #e2c47a; }
      .luxe-toast.error .luxe-toast-icon { background: rgba(179,73,47,0.18); color: #e79176; }
      .luxe-toast.info .luxe-toast-icon { background: rgba(138,128,112,0.18); color: #cfc6b4; }
      .luxe-toast-icon svg { width: 15px; height: 15px; }
      .luxe-toast-body { flex: 1; min-width: 0; }
      .luxe-toast-title { font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.35; }
      .luxe-toast-message { font-size: 12.5px; color: #b9b0a0; margin-top: 3px; line-height: 1.45; }
      .luxe-toast-progress {
        position: absolute; left: 0; bottom: 0; height: 2px;
        background: linear-gradient(90deg, #c9a84c, #e2c47a);
        animation-name: luxeToastProgress;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }
      @keyframes luxeToastIn {
        from { opacity: 0; transform: translateX(24px) scale(0.97); }
        to { opacity: 1; transform: translateX(0) scale(1); }
      }
      @keyframes luxeToastOut {
        to { opacity: 0; transform: translateX(24px) scale(0.97); }
      }
      @keyframes luxeToastProgress {
        from { width: 100%; } to { width: 0%; }
      }
      .luxe-btn-spinner {
        display: inline-block;
        width: 15px; height: 15px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.35);
        border-top-color: #fff;
        animation: luxeSpin 0.7s linear infinite;
        vertical-align: -3px;
        margin-right: 8px;
      }
      @keyframes luxeSpin { to { transform: rotate(360deg); } }
      .luxe-loading { opacity: 0.85; cursor: progress !important; pointer-events: none; }
      @media (max-width: 480px) {
        #${CONTAINER_ID} { left: 16px; right: 16px; top: 16px; max-width: none; }
      }
    `;
    document.head.appendChild(style);
  }

  function ensureContainer() {
    var el = document.getElementById(CONTAINER_ID);
    if (!el) {
      el = document.createElement('div');
      el.id = CONTAINER_ID;
      document.body.appendChild(el);
    }
    return el;
  }

  var ICONS = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
  };

  function toast(type, title, message, duration) {
    try {
      ensureStyles();
      var container = ensureContainer();
      type = ICONS[type] ? type : 'info';
      duration = duration || (type === 'error' ? 6000 : 4200);

      var el = document.createElement('div');
      el.className = 'luxe-toast ' + type;
      el.innerHTML =
        '<span class="luxe-toast-icon">' + ICONS[type] + '</span>' +
        '<span class="luxe-toast-body">' +
          '<span class="luxe-toast-title"></span>' +
          (message ? '<span class="luxe-toast-message"></span>' : '') +
        '</span>' +
        '<span class="luxe-toast-progress" style="animation-duration:' + duration + 'ms;"></span>';
      el.querySelector('.luxe-toast-title').textContent = title || '';
      if (message) el.querySelector('.luxe-toast-message').textContent = message;

      function dismiss() {
        if (el.classList.contains('leaving')) return;
        el.classList.add('leaving');
        setTimeout(function () { el.remove(); }, 350);
      }
      el.addEventListener('click', dismiss);
      var timer = setTimeout(dismiss, duration);
      el.addEventListener('mouseenter', function () { clearTimeout(timer); });
      el.addEventListener('mouseleave', function () { timer = setTimeout(dismiss, 1200); });

      container.appendChild(el);
      return el;
    } catch (err) {
      // Never let a UI-polish failure break the actual auth flow.
      console.warn('LuxeUI.toast failed:', err.message);
    }
  }

  function loading(button, isLoading, label) {
    if (!button) return;
    try {
      ensureStyles();
      if (isLoading) {
        if (!originalContent.has(button)) originalContent.set(button, button.innerHTML);
        button.innerHTML = '<span class="luxe-btn-spinner"></span>' + (label || 'Please wait…');
        button.classList.add('luxe-loading');
        button.disabled = true;
      } else {
        if (originalContent.has(button)) {
          button.innerHTML = originalContent.get(button);
          originalContent.delete(button);
        }
        button.classList.remove('luxe-loading');
        button.disabled = false;
      }
    } catch (err) {
      console.warn('LuxeUI.loading failed:', err.message);
    }
  }

  global.LuxeUI = { toast: toast, loading: loading };
})(window);

</script>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="eyebrow">Hospitality Management System</div>
      <h1>QUOR<em>VA</em></h1>
      <p class="subtext">Register your hotel and create the first admin account for your property.</p>
    </div>

    <div class="alert" id="errorMsg"></div>
    <div class="alert success" id="successMsg"></div>
    <div class="verification-box" id="verificationBox"></div>

    <form id="signupForm">
      <div class="field-group">
        <label for="hotelName">Hotel Name</label>
        <input id="hotelName" name="hotelName" type="text" placeholder="LUXE Hotel" required />
      </div>
      <div class="field-group">
        <label for="fullName">Your Full Name</label>
        <input id="fullName" name="fullName" type="text" placeholder="Alex Morgan" required />
      </div>
      <div class="field-group">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" placeholder="admin@yourhotel.com" required />
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="At least 8 characters" required />
      </div>
      <div class="field-group">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter password" required />
      </div>
      <button type="submit">Create Hotel Account</button>
    </form>

    <div class="footer-link">
      Already have an account? <a href="/">Sign in</a>
    </div>
  </div>

  <script>
    const API_BASE_URL = window.location.protocol === 'file:' || !window.location.hostname || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:3000'
      : 'https://hotelqrservices.onrender.com';
    const form = document.getElementById('signupForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const verificationBox = document.getElementById('verificationBox');

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.add('show');
      successMsg.classList.remove('show');
      verificationBox.style.display = 'none';
    }

    function showSuccess(message, emailDelivered) {
      successMsg.textContent = message;
      successMsg.classList.add('show');
      errorMsg.classList.remove('show');
      if (emailDelivered) {
        verificationBox.textContent = 'A verification email has been sent. Please check your inbox and follow the secure link there.';
        verificationBox.style.display = 'block';
      } else {
        // Don't contradict the message above by claiming the email sent
        // when it didn't — just hide the box instead of showing two
        // conflicting statements.
        verificationBox.style.display = 'none';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      showError('');
      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');

      const payload = {
        hotelName: document.getElementById('hotelName').value.trim(),
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        confirmPassword: document.getElementById('confirmPassword').value
      };

      const submitBtn = form.querySelector('button[type="submit"]');
      window.LuxeUI?.loading(submitBtn, true, 'Creating your account…');

      try {
        const response = await fetch(API_BASE_URL + '/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          const msg = data.error || 'Registration failed.';
          showError(msg);
          window.LuxeUI?.toast('error', 'Account creation failed', msg);
          return;
        }

        if (data.requiresVerification) {
          const msg = data.message || 'Account created. Please verify your email before signing in.';
          showSuccess(msg, data.emailDelivered);
          window.LuxeUI?.toast('success', 'Hotel account created', data.emailDelivered ? 'Check your inbox for a verification link.' : 'Contact support to verify your account manually.');
          form.reset();
          return;
        }

        window.LuxeUI?.toast('success', 'Hotel account created', 'Taking you to your admin suite…');
        localStorage.setItem('hotelAdminToken', data.token);
        localStorage.setItem('hotelAdminUser', JSON.stringify(data.user || {}));
        setTimeout(() => { window.location.href = data.redirectUrl || 'hotel_admin.html'; }, 450);
      } catch (err) {
        showError('Unable to reach the server. Please try again.');
        window.LuxeUI?.toast('error', 'Connection problem', 'Unable to reach the server. Please try again.');
      } finally {
        window.LuxeUI?.loading(submitBtn, false);
      }
    });
  </script>
</body>
</html>
